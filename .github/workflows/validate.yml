name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skill-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate package structure, links, and Python syntax
        run: python tools/validate_skill.py

  r-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Parse bundled R helpers
        shell: Rscript {0}
        run: |
          files <- list.files("eam-modeling/scripts", pattern = "[.]R$", full.names = TRUE)
          invisible(lapply(files, parse))
          cat("Parsed", length(files), "R helper scripts.\n")
